[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdoc"
version = "0.1.0"
description = "OCR-first pipeline: images -> PaddleOCR -> AI reconstruction -> Markdown -> DOCX/PDF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "paddleocr>=3.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "typer>=0.12",
    "PyYAML>=6.0",
    "openai>=1.50",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ocrdoc = "ocr_reconstructor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: test requires the PaddleOCR package and its downloadable models (skipped when unavailable)",
]
